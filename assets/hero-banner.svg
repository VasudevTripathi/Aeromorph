<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="75%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#090d16" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#05070c" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="cyanSpot" cx="80%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purpleSpot" cx="30%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <!-- Linear Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="wireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="frustumGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur2"/>
      <feGaussianBlur stdDeviation="3" result="blur1"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes floatDrone {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(0.8deg); }
      }
      @keyframes scanLaser {
        0% { transform: translateY(120px); opacity: 0; }
        20% { opacity: 0.9; }
        80% { opacity: 0.9; }
        100% { transform: translateY(380px); opacity: 0; }
      }
      @keyframes pulsePoint {
        0%, 100% { transform: scale(1); opacity: 0.4; }
        50% { transform: scale(1.6); opacity: 1; }
      }
      @keyframes dashFlow {
        from { stroke-dashoffset: 60; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes blinkCursor {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .anim-drone { animation: floatDrone 6s ease-in-out infinite; }
      .anim-laser { animation: scanLaser 4.5s ease-in-out infinite; }
      .anim-pulse { transform-box: fill-box; transform-origin: center; animation: pulsePoint 2.8s ease-in-out infinite; }
      .anim-pulse-delay { transform-box: fill-box; transform-origin: center; animation: pulsePoint 3.2s ease-in-out 1.2s infinite; }
      .anim-dash { stroke-dasharray: 6 6; animation: dashFlow 2.5s linear infinite; }
      .anim-radar { transform-box: fill-box; transform-origin: center; animation: radarSweep 10s linear infinite; }
      .anim-blink { animation: blinkCursor 1s step-start infinite; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="500" rx="16" fill="#080c14" />
  <rect width="1200" height="500" rx="16" fill="url(#bgGlow)" />
  <rect width="1200" height="500" rx="16" fill="url(#cyanSpot)" />
  <rect width="1200" height="500" rx="16" fill="url(#purpleSpot)" />

  <!-- Geometric Grid Plane (Perspective 3D Floor) -->
  <g opacity="0.22" stroke="#38bdf8" stroke-width="0.8">
    <line x1="580" y1="460" x2="1200" y2="460"/>
    <line x1="620" y1="420" x2="1200" y2="420"/>
    <line x1="660" y1="380" x2="1200" y2="380"/>
    <line x1="700" y1="340" x2="1200" y2="340"/>
    <line x1="740" y1="300" x2="1200" y2="300"/>
    <line x1="780" y1="260" x2="1200" y2="260"/>

    <!-- Perspective vanishing lines converging to virtual vanishing point (940, 200) -->
    <line x1="600" y1="480" x2="940" y2="220"/>
    <line x1="680" y1="480" x2="940" y2="220"/>
    <line x1="760" y1="480" x2="940" y2="220"/>
    <line x1="840" y1="480" x2="940" y2="220"/>
    <line x1="940" y1="480" x2="940" y2="220"/>
    <line x1="1040" y1="480" x2="940" y2="220"/>
    <line x1="1120" y1="480" x2="940" y2="220"/>
    <line x1="1200" y1="480" x2="940" y2="220"/>
  </g>

  <!-- Left Content: High-Tech Branding & Value Statement -->
  <g transform="translate(60, 60)">
    <!-- Security / Status Badge -->
    <g transform="translate(0, 0)">
      <rect width="320" height="28" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <circle cx="14" cy="14" r="5" fill="#10b981" filter="url(#neonGlow)"/>
      <text x="28" y="18" fill="#94a3b8" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11" font-weight="600" letter-spacing="1.2">100% LOCAL // AIR-GAPPED DESKTOP</text>
    </g>

    <!-- Main Title -->
    <g transform="translate(0, 75)">
      <text x="0" y="0" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="54" font-weight="900" letter-spacing="6">AEROMORPH</text>
      <text x="4" y="32" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" letter-spacing="4">AUTONOMOUS 3D PHOTOGRAMMETRY STUDIO</text>
    </g>

    <!-- Value Proposition -->
    <g transform="translate(0, 155)">
      <text x="0" y="0" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="400">
        Turn aerial drone sweeps &amp; 4K video feeds into dense
      </text>
      <text x="0" y="26" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="400">
        point clouds and textured 3D meshes on consumer laptops.
      </text>
    </g>

    <!-- Architectural Spec Matrix -->
    <g transform="translate(0, 235)">
      <!-- Spec Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="138" height="52" rx="8" fill="#0b1329" stroke="#1e293b" stroke-width="1"/>
        <text x="14" y="20" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">MEMORY CEILING</text>
        <text x="14" y="38" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700">8 GB RAM</text>
      </g>
      <!-- Spec Pill 2 -->
      <g transform="translate(150, 0)">
        <rect width="138" height="52" rx="8" fill="#0b1329" stroke="#1e293b" stroke-width="1"/>
        <text x="14" y="20" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">DUAL ENGINE</text>
        <text x="14" y="38" fill="#818cf8" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700">COLMAP+MVS</text>
      </g>
      <!-- Spec Pill 3 -->
      <g transform="translate(300, 0)">
        <rect width="138" height="52" rx="8" fill="#0b1329" stroke="#1e293b" stroke-width="1"/>
        <text x="14" y="20" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">VIEWPORT</text>
        <text x="14" y="38" fill="#a855f7" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700">THREE.JS 3D</text>
      </g>
    </g>

    <!-- Terminal Status Line -->
    <g transform="translate(0, 330)">
      <rect width="438" height="34" rx="6" fill="#050811" stroke="#1e293b" stroke-width="1"/>
      <text x="14" y="22" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="12">> </text>
      <text x="32" y="22" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12">SfM Triangulation: <tspan fill="#38bdf8">14,290 cameras solved</tspan></text>
      <rect x="362" y="11" width="8" height="13" fill="#38bdf8" class="anim-blink"/>
    </g>
  </g>

  <!-- Right Section: Jaw-Dropping 3D Photogrammetry Viewport -->
  <g id="viewport-3d" transform="translate(620, 20)">

    <!-- Outer Viewport Frame -->
    <rect x="0" y="20" width="530" height="420" rx="14" fill="#050814" fill-opacity="0.8" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Viewport Header HUD -->
    <rect x="0" y="20" width="530" height="34" rx="14" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
    <circle cx="20" cy="37" r="4" fill="#ef4444"/>
    <circle cx="36" cy="37" r="4" fill="#f59e0b"/>
    <circle cx="52" cy="37" r="4" fill="#10b981"/>
    <text x="75" y="41" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">VIEWPORT: THREE.JS // ORBIT MODE // 60 FPS</text>
    <rect x="420" y="26" width="96" height="22" rx="4" fill="#1e293b"/>
    <text x="430" y="41" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">DENSE MESH</text>

    <!-- 3D Coordinate Compass / Gizmo (Top Right) -->
    <g transform="translate(460, 95)">
      <circle cx="0" cy="0" r="26" fill="#0a0f1d" stroke="#1e293b" stroke-width="1"/>
      <!-- X-Axis (Red) -->
      <line x1="0" y1="0" x2="18" y2="6" stroke="#ef4444" stroke-width="2"/>
      <text x="21" y="9" fill="#ef4444" font-family="sans-serif" font-size="9" font-weight="bold">X</text>
      <!-- Y-Axis (Green) -->
      <line x1="0" y1="0" x2="0" y2="-20" stroke="#10b981" stroke-width="2"/>
      <text x="-3" y="-23" fill="#10b981" font-family="sans-serif" font-size="9" font-weight="bold">Y</text>
      <!-- Z-Axis (Blue) -->
      <line x1="0" y1="0" x2="-14" y2="12" stroke="#38bdf8" stroke-width="2"/>
      <text x="-22" y="16" fill="#38bdf8" font-family="sans-serif" font-size="9" font-weight="bold">Z</text>
    </g>

    <!-- 3D Reconstructed Mesh Geometry (Isometric Faceted Topology) -->
    <g transform="translate(60, 110)">
      <!-- Ground shadow / base plate -->
      <polygon points="50,260 210,190 390,260 220,320" fill="#091322" opacity="0.7"/>

      <!-- 3D Polygonal Mesh Faces with gradient fills simulating lighting -->
      <!-- Foundation terrain -->
      <polygon points="60,250 160,200 240,240 130,290" fill="#111c38" stroke="#1e3a8a" stroke-width="0.8" opacity="0.9"/>
      <polygon points="160,200 280,180 360,220 240,240" fill="#172554" stroke="#2563eb" stroke-width="0.8" opacity="0.9"/>
      <polygon points="240,240 360,220 400,260 280,290" fill="#0f172a" stroke="#1d4ed8" stroke-width="0.8" opacity="0.9"/>

      <!-- Main Architectural 3D Structure (Tower / Castle / Structure Wireframe) -->
      <!-- Left Facets -->
      <polygon points="170,210 220,130 250,140 210,220" fill="#1e1b4b" stroke="#38bdf8" stroke-width="1.2" opacity="0.85"/>
      <polygon points="130,190 170,210 210,220 160,200" fill="#0f172a" stroke="#38bdf8" stroke-width="0.9"/>
      <polygon points="220,130 260,70 290,80 250,140" fill="#312e81" stroke="#818cf8" stroke-width="1.2" opacity="0.9"/>

      <!-- Center Spire / Apex -->
      <polygon points="260,70 280,30 300,75 280,85" fill="#4338ca" stroke="#c084fc" stroke-width="1.5" filter="url(#neonGlow)"/>

      <!-- Right Facets -->
      <polygon points="250,140 290,80 330,120 290,180" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" opacity="0.85"/>
      <polygon points="290,180 330,120 370,160 330,210" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
      <polygon points="210,220 250,140 290,180 260,230" fill="#1e1b4b" stroke="#38bdf8" stroke-width="1" opacity="0.9"/>

      <!-- Detailed Wireframe Internal Triangles (Poisson Delaunay surface representation) -->
      <line x1="220" y1="130" x2="210" y2="220" stroke="#38bdf8" stroke-width="0.7" stroke-dasharray="2 2"/>
      <line x1="170" y1="210" x2="250" y2="140" stroke="#818cf8" stroke-width="0.7" stroke-dasharray="2 2"/>
      <line x1="250" y1="140" x2="280" y2="85" stroke="#c084fc" stroke-width="0.7"/>
      <line x1="260" y1="70" x2="300" y2="75" stroke="#38bdf8" stroke-width="0.7"/>
      <line x1="290" y1="80" x2="290" y2="180" stroke="#38bdf8" stroke-width="0.7" stroke-dasharray="2 2"/>
      <line x1="330" y1="120" x2="260" y2="230" stroke="#818cf8" stroke-width="0.6"/>

      <!-- Dense Point Cloud Scattered Nodes (Representing dense depth-fusion points) -->
      <g fill="#38bdf8" opacity="0.7">
        <circle cx="218" cy="128" r="1.5"/>
        <circle cx="225" cy="115" r="1.2"/>
        <circle cx="232" cy="102" r="1.5"/>
        <circle cx="240" cy="92" r="1.2"/>
        <circle cx="255" cy="74" r="1.8"/>
        <circle cx="270" cy="50" r="1.5"/>
        <circle cx="282" cy="42" r="1.2"/>
        <circle cx="278" cy="65" r="1.5"/>
        <circle cx="295" cy="78" r="1.5"/>
        <circle cx="310" cy="98" r="1.2"/>
        <circle cx="320" cy="112" r="1.5"/>
        <circle cx="340" cy="138" r="1.2"/>
        <circle cx="355" cy="152" r="1.5"/>
        <circle cx="180" cy="195" r="1.5"/>
        <circle cx="195" cy="205" r="1.2"/>
        <circle cx="230" cy="215" r="1.5"/>
        <circle cx="250" cy="225" r="1.2"/>
        <circle cx="275" cy="210" r="1.5"/>
        <circle cx="315" cy="195" r="1.2"/>
      </g>

      <!-- Pulsing SIFT Keypoint Landmarks -->
      <circle cx="280" cy="30" r="4" fill="#a855f7" class="anim-pulse" filter="url(#intenseGlow)"/>
      <circle cx="220" cy="130" r="3.5" fill="#38bdf8" class="anim-pulse-delay" filter="url(#intenseGlow)"/>
      <circle cx="330" cy="120" r="3.5" fill="#00f2fe" class="anim-pulse" filter="url(#intenseGlow)"/>
      <circle cx="250" cy="140" r="3" fill="#10b981" class="anim-pulse-delay" filter="url(#neonGlow)"/>
      <circle cx="260" cy="230" r="3.5" fill="#38bdf8" class="anim-pulse" filter="url(#intenseGlow)"/>

      <!-- Animated LiDAR / Photogrammetry Laser Scan Beam -->
      <g class="anim-laser">
        <line x1="80" y1="0" x2="380" y2="0" stroke="url(#laserGrad)" stroke-width="3" filter="url(#intenseGlow)"/>
        <polygon points="80,0 380,0 350,15 110,15" fill="#38bdf8" opacity="0.15"/>
      </g>
    </g>

    <!-- Drone Aerial Camera Node (Top Left of Viewport) -->
    <g class="anim-drone" transform="translate(110, 80)">
      <!-- Frustum Projection Rays (Rays cast from camera down to 3D model) -->
      <polygon points="0,0 80,180 200,160" fill="url(#frustumGrad)"/>
      <line x1="0" y1="0" x2="80" y2="180" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.7"/>
      <line x1="0" y1="0" x2="200" y2="160" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.7"/>
      <line x1="0" y1="0" x2="140" y2="230" stroke="#38bdf8" stroke-width="0.8" opacity="0.4"/>

      <!-- Drone Body -->
      <ellipse cx="0" cy="0" rx="14" ry="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <!-- Rotors -->
      <line x1="-22" y1="-8" x2="22" y2="8" stroke="#64748b" stroke-width="2"/>
      <line x1="-22" y1="8" x2="22" y2="-8" stroke="#64748b" stroke-width="2"/>
      <ellipse cx="-22" cy="-8" rx="8" ry="2.5" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.8"/>
      <ellipse cx="22" cy="8" rx="8" ry="2.5" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.8"/>
      <ellipse cx="-22" cy="8" rx="8" ry="2.5" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.8"/>
      <ellipse cx="22" cy="-8" rx="8" ry="2.5" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.8"/>

      <!-- Camera Lens Core -->
      <circle cx="0" cy="2" r="3" fill="#00f2fe" filter="url(#intenseGlow)"/>

      <!-- Telemetry Callout Box -->
      <g transform="translate(18, -25)">
        <rect width="112" height="22" rx="4" fill="#090d16" stroke="#38bdf8" stroke-width="0.8"/>
        <text x="8" y="15" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">CAM #082 [EXIF OK]</text>
      </g>
    </g>

    <!-- Bottom HUD Telemetry Strip -->
    <g transform="translate(20, 380)">
      <rect width="490" height="42" rx="8" fill="#080e1e" stroke="#1e293b" stroke-width="1"/>
      <text x="16" y="18" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">VERTS: <tspan fill="#e2e8f0" font-weight="700">4,819,204</tspan></text>
      <text x="130" y="18" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">FACES: <tspan fill="#e2e8f0" font-weight="700">2,109,380</tspan></text>
      <text x="250" y="18" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">NORMALS: <tspan fill="#10b981" font-weight="700">COMPUTED</tspan></text>
      <text x="375" y="18" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">VRAM: <tspan fill="#38bdf8" font-weight="700">1.2 GB / 8 GB</tspan></text>

      <line x1="16" y1="28" x2="474" y2="28" stroke="#1e293b" stroke-width="0.8"/>
      <text x="16" y="38" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="8">CAMERA TRAJECTORY: 120 POSES CONVERGED (RESIDUAL: 0.42 px)</text>
      <text x="390" y="38" fill="#a855f7" font-family="'JetBrains Mono', monospace" font-size="8">MESH: POISSON (L8)</text>
    </g>
  </g>

  <!-- Border Trim -->
  <rect x="0.5" y="0.5" width="1199" height="499" rx="15.5" fill="none" stroke="#1e293b" stroke-width="1"/>
</svg>
